# UkTxGNN Jekyll Configuration
title: UkTxGNN - UK Drug Repurposing Predictions
description: Drug repurposing predictions for the United Kingdom using the TxGNN graph neural network

url: "https://uktxgnn.yao.care"
baseurl: ""

# Language and locale
lang: en-GB
country_code: GB
country_name: United Kingdom
regulatory_agency: "Medicines and Healthcare products Regulatory Agency (MHRA)"
regulatory_agency_url: "https://www.gov.uk/government/organisations/medicines-and-healthcare-products-regulatory-agency"

# Theme settings
remote_theme: just-the-docs/just-the-docs
plugins:
  - jekyll-remote-theme
  - jekyll-sitemap
  - jekyll-feed

# RSS Feed
feed:
  path: feed.xml
  collections:
    drugs:
      path: "/drugs/feed.xml"

# Build settings
markdown: kramdown
highlighter: rouge

# Collections
collections:
  drugs:
    output: true
    permalink: /drugs/:name/
  news:
    output: true
    permalink: /news/:name/

# Defaults
defaults:
  - scope:
      path: ""
      type: "drugs"
    values:
      layout: "drug"
  # 2026-11-03：SMART 啟動端點與應用殼（需從 EHR 啟動、沒有可收錄內容）不列入 sitemap；
  # 兩頁本身也有 <meta name="robots" content="noindex">。獨立測試頁 standalone.html 照常收錄。
  - scope:
      path: "smart/launch.html"
    values:
      sitemap: false
  - scope:
      path: "smart/app.html"
    values:
      sitemap: false

# Exclude files
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .git
  - .gitignore

footer_content: "Copyright &copy; 2026 藥提醒科技有限公司 (yao.care). This report is for research purposes only and does not constitute medical advice."


