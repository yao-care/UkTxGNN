name: Monitor Health News

on:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours
  workflow_dispatch:

permissions:
  contents: write
  actions: write  # 推送後觸發 pages.yml（GITHUB_TOKEN 的 push 不會觸發其他 workflow）

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Fetch UK Health News
        run: |
          echo "Fetching UK health news..."
          python scripts/fetchers/uk_news.py || echo "News fetch skipped"

      - name: Process news
        run: |
          if [ -f scripts/process_news.py ]; then
            python scripts/process_news.py
          fi

      - name: Commit changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"

          [ -d data/news ] && git add data/news/*.json 2>/dev/null || true
          [ -d docs/_news ] && git add docs/_news/
          [ -f docs/data/news-index.json ] && git add docs/data/news-index.json 2>/dev/null || true
          [ -f docs/_data/drug_news.json ] && git add docs/_data/drug_news.json || true

          if git diff --staged --quiet; then
            echo "No news updates"
          else
            git commit -m "Update health news $(date +%Y-%m-%d-%H%M)"
            git push
            gh workflow run pages.yml --ref main || echo "Pages dispatch failed"
          fi
